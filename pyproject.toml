[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-incident-simulator"
version = "0.1.0"
description = "Safe, deterministic generation and evaluation of synthetic cyber incidents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Vincent Plessy"}
]
keywords = ["cybersecurity", "simulation", "detection-engineering", "mitre-attack"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]
dependencies = []

[project.scripts]
incident-sim = "incident_simulator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_simulator = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
